    <style>
        @media print {

            @page {
                size: letter;

        .content1 {

        }

            height: 179mm;
            background-image: url(minuta2.png);
            background-size: 94mm 179mm;
        }

        .horizontal {
            background-image: url(minuta1.png);
            height: 94mm;
            width: 179mm;
            background-size: 179mm 94mm;
        }
    </style>
</head>

<body>
    <div class="content1">
        <div class="formato vertical"> </div>
        <div class="formato vertical"> </div>
    </div>
