<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Línea en L con Konva</title>
    <script src="https://cdn.jsdelivr.net/npm/konva@9/konva.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f9f9ff;
        }

        #container {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <script>

        function CreateLine(
            {
                Coordinates = {
                    begin: { x: 0, y: 0 },
                    end: { x: 0, y: 0 },
                },
                Radius = 15,
                Style = "",
                LineWidth = 4
            }
        ) {
            let dashOffset = 0;

            x1 = Coordinates.begin.x;
            x2 = Coordinates.end.x;
            y1 = Coordinates.begin.y;
            y2 = Coordinates.end.y;


            _path_ = new Konva.Shape({
                sceneFunc: (ctx, shape) => {
                    let _HORIZONTAL_DIRECTION_ = 1;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    switch (String(Style).trim().toLocaleLowerCase()) {

                        case "squad-buttom":
                        case "squad-top": {
                            // Determinar dirección horizontal y vertical
                            const dx = x2 - x1;
                            const dy = y2 - y1;
                            const signX = Math.sign(dx);
                            const signY = Math.sign(dy);
                            if (Style === "squad-buttom") {
                                if (signX === 1 && signY === 1) {
                                    ctx.lineTo(x1, y2 - Radius);
                                    ctx.arcTo(x1, y2, x1 + Radius, y2, Radius);
                                } else if (signX === 1 && signY === -1) {
                                    ctx.lineTo(x2 - Radius, y1);
                                    ctx.arcTo(x2, y1, x2, y1 - Radius, Radius);
                                } else if (signX === -1 && signY === 1) {
                                    ctx.lineTo(x1, y2 - Radius);
                                    ctx.arcTo(x1, y2, x1 - Radius, y2, Radius);
                                } else if (signX === -1 && signY === -1) {
                                    ctx.lineTo(x2 + Radius, y1);
                                    ctx.arcTo(x2, y1, x2, y1 - Radius, Radius);
                                }
                            } else {
                                if (signX === 1 && signY === 1) {
                                    ctx.lineTo(x2 - Radius, y1);
                                    ctx.arcTo(x2, y1, x2, y1 + Radius, Radius);
                                } else if (signX === -1 && signY === -1) {
                                    ctx.lineTo(x1, y2 + Radius);
                                    ctx.arcTo(x1, y2, x1 - Radius, y2, Radius);
                                } else if (signX === 1 && signY === -1) {
                                    ctx.lineTo(x1, y2 + Radius);
                                    ctx.arcTo(x1, y2, x1 + Radius, y2, Radius);
                                } else if (signX === -1 && signY === 1) {
                                    ctx.lineTo(x2 + Radius, y1);
                                    ctx.arcTo(x2, y1, x2, y1 + Radius, Radius);
                                }
                            }
                            break;
                        }
                        case "zeta-horizontal":
                        case "zeta-vertical": {
                            const xStart = Coordinates.begin.x;
                            const xEnd = Coordinates.end.x;
                            const yStart = Coordinates.begin.y;
                            const yEnd = Coordinates.end.y;
                            const hDir = xStart > xEnd ? -1 : 1;
                            const vDir = yStart > yEnd ? -1 : 1;
                            if (Style === "zeta-horizontal") {
                                const yMid = yEnd - ((yEnd - yStart) / 2);
                                ctx.lineTo(xStart, yMid - (Radius * vDir));
                                ctx.arcTo(xStart, yMid, xStart + (Radius * hDir), yMid, Radius);
                                ctx.lineTo(xEnd - (Radius * hDir), yMid);
                                ctx.arcTo(xEnd, yMid, xEnd, yMid + (Radius * vDir), Radius);
                            } else {
                                const xMid = xEnd - ((xEnd - xStart) / 2);
                                ctx.lineTo(xMid - (Radius * hDir), yStart);
                                ctx.arcTo(xMid, yStart, xMid, yStart + (Radius * vDir), Radius);
                                ctx.lineTo(xMid, yEnd - (Radius * vDir));
                                ctx.arcTo(xMid, yEnd, xMid + (Radius * hDir), yEnd, Radius);
                            }
                            break;
                        }

                        default:
                            break;
                    }

                    ctx.lineTo(x2, y2);
                    ctx.setLineDash([12, 6]);
                    ctx.lineDashOffset = dashOffset;
                    ctx.strokeStyle = 'purple';
                    ctx.lineWidth = LineWidth;
                    ctx.stroke();
                }
            });


            // Animación más suave
            const anim = new Konva.Animation((frame) => {
                dashOffset -= 0.5; // velocidad reducida
                if (dashOffset < -18) dashOffset = 0;
                _path_.getLayer().batchDraw();
            }, layer);

            anim.start();

            return _path_;
        }
        const stage = new Konva.Stage({
            container: 'container',
            width: window.innerWidth,
            height: window.innerHeight,
        });

        const layer = new Konva.Layer();

        const animatedLine = CreateLine(
            {
                Coordinates: {
                    begin:
                    { x: 200, y: 200 },
                    end:
                    { x: 100, y: 400 },
                },
                radius: 20,
                Style: "zeta-vertical"
            }

        );

        /* const animatedLine1 = CreateLine(
             {
                 Coordinates: {
                     begin: { x: 600, y: 350 },
                     end: { x: 800, y: 400 },
                 },
                 radius: 20,
                 Style: "zeta-horizontal"
             }
 
         );
 
 
         const animatedLine2 = CreateLine(
             {
                 Coordinates: {
                     end:
                         { x: 900, y: 350 },
                     begin:
                         { x: 1100, y: 400 },
                 },
                 radius: 20,
                 Style: "left-squad-top"
             }
 
         );*/

        const _grid_Pattern_ = new Konva.Group({
            name: "grid_Pattern",
            width: stage.width(),
            height: stage.height(),
            x: 0,
            y: 0

        });
        for (let _x_ = 0; _x_ <= stage.width() + 1; _x_ += 10) {
            _grid_Pattern_.add(new Konva.Line({
                points: [_x_, 0, _x_, stage.height()],
                stroke: (_x_ % 100 === 0) ? "#0d702e" : (_x_ % 50 === 0) ? "#0d702e" : "#26be59",
                strokeWidth: (_x_ % 100 === 0) ? 2 : 1,
                lineCap: "round",
                lineJoin: "round",
                opacity: 0.5
            }));



        }
        for (let _y_ = 0; _y_ <= stage.height() + 1; _y_ += 10) {

            _grid_Pattern_.add(new Konva.Line({
                points: [0, _y_, stage.width(), _y_],
                stroke: (_y_ % 100 === 0) ? "#0d702e" : (_y_ % 50 === 0) ? "#0d702e" : "#26be59",
                strokeWidth: (_y_ % 100 === 0) ? 2 : 1,
                lineCap: "round",
                lineJoin: "round",
                opacity: 0.5
            }));
        }



        layer.add(
            _grid_Pattern_,
            animatedLine,
            //  animatedLine1,
            //  animatedLine2
        );
        stage.add(layer);



    </script>
</body>

</html>
